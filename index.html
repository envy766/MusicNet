

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MusicNet — Playlist Player (Enhanced)</title>

<style>
:root{
  --bg1:#0f1020;
  --bg2:#0b2545;
  --accent:#6ef0ff;
  --accent2:#8a4fff;
  --accent3:#ff66cc;
  --neon:#6ef0ff;
  --glass:rgba(255,255,255,0.03);
  --music-beat:0;
  --music-overall:0;
  --edge-glow:8px;
  --edge-opacity:0.08;
}

/* ------------------------
   RESET & LAYOUT
------------------------ */
*{box-sizing:border-box}

html,body{
  height:100%;
  margin:0;
  font-family:"Poppins",sans-serif;
  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(110,240,255,calc(0.035 + var(--music-overall)*0.04)),
      transparent 45%
    ),
    radial-gradient(
      circle at 20% 80%,
      rgba(138,79,255,calc(0.04 + var(--music-overall)*0.05)),
      transparent 42%
    ),
    linear-gradient(145deg,var(--bg1),var(--bg2));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* ------------------------
   SCREEN EDGE LIGHT
------------------------ */
html::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:2;

  border:2px solid
    rgba(110,240,255,calc(.04 + var(--music-beat)*.07));

  box-shadow:
    inset 0 0 10px
      rgba(110,240,255,calc(.03 + var(--music-beat)*.07)),
    inset 0 0 24px
      rgba(110,240,255,calc(.015 + var(--music-beat)*.045)),
    inset 0 0 45px
      rgba(138,79,255,calc(.01 + var(--music-beat)*.035)),
    0 0 8px
      rgba(110,240,255,calc(.025 + var(--music-beat)*.055));
}
html::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:2;

  background:
    linear-gradient(
      to bottom,
      rgba(110,240,255,calc(.015 + var(--music-beat)*.045)),
      transparent 18%,
      transparent 82%,
      rgba(138,79,255,calc(.015 + var(--music-beat)*.045))
    ),
    linear-gradient(
      to right,
      rgba(110,240,255,calc(.01 + var(--music-beat)*.035)),
      transparent 16%,
      transparent 84%,
      rgba(255,102,204,calc(.01 + var(--music-beat)*.03))
    );

  opacity:
    calc(.25 + var(--music-beat)*.15);
}

transition:none;
will-change:opacity;
}

/* ------------------------
   BACKGROUND CANVAS
------------------------ */
canvas#bg{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}

/* ------------------------
   PAGE FOOTER
------------------------ */
.page-footer{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  font-size:10px;
  color:rgba(255,255,255,0.1);
  pointer-events:none;
  z-index:1;
  letter-spacing:.4px;
  text-align:center;
  line-height:1.4;
}

.page-footer .version{
  font-size:10px;
  opacity:1;
  color:rgba(255,255,255,0.1);
  letter-spacing:.4px;
}

/* ------------------------
   BACKGROUND WATERMARK
------------------------ */
.bg-text{
  position:fixed;
  top:10%;
  left:50%;
  transform:translateX(-50%);
  font-size:60px;
  font-weight:1000;
  letter-spacing:4px;
  color:rgba(110,240,255,0.07);
  text-transform:uppercase;
  pointer-events:none;
  user-select:none;
  z-index:0;
  white-space:nowrap;
  text-align:center;
  text-shadow:
    0 0 20px rgba(110,240,255,0.04),
    0 0 40px rgba(138,79,255,0.03);
}

/* ------------------------
   PLAYER
------------------------ */
.player{
  width:380px;
  max-width:95vw;
  max-height:86vh;
  background:rgba(255,255,255,0);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:14px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  position:relative;
  overflow:visible;
  overflow-x:hidden;
  box-shadow:
    0 8px 30px rgba(0,0,0,.15),
    0 0 30px rgba(110,240,255,.025);
  z-index:3;
}

/* ------------------------
   TOOLBAR
------------------------ */
.toolbar{
  display:flex;
  gap:8px;
  align-items:center;
}

.search{
  flex:1;
  padding:8px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.04);
  background:rgba(255,255,255,.02);
  color:#fff;
  font-size:.88rem;
  outline:none;
  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.search:focus{
  border-color:rgba(110,240,255,.3);
  background:rgba(110,240,255,.025);
  box-shadow:0 0 12px rgba(110,240,255,.08);
}

.icon-btn{
  padding:8px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.04);
  background:transparent;
  color:var(--neon);
  cursor:pointer;
}

.select-btn{
  padding:8px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.06);
  background:transparent;
  color:var(--neon);
  font-size:.88rem;
  cursor:pointer;
  backdrop-filter:blur(4px);
}

/* ------------------------
   GENRE PANEL
------------------------ */
.genre-panel{
  position:absolute;
  top:56px;
  left:16px;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.03),
      rgba(255,255,255,.01)
    );
  border:1px solid rgba(255,255,255,.04);
  padding:8px;
  border-radius:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  min-width:180px;
  box-shadow:0 8px 30px rgba(2,6,23,.6);
  backdrop-filter:blur(12px);
  z-index:4;
}

.genre-chip{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.01);
  border:1px solid rgba(255,255,255,.02);
  font-size:.86rem;
  color:rgba(255,255,255,.9);
  cursor:pointer;
  transition:
    background .2s ease,
    box-shadow .2s ease,
    border-color .2s ease;
}

.genre-chip input{accent-color:var(--accent)}

.genre-chip.active{
  background:rgba(110,240,255,.08);
  border-color:rgba(110,240,255,.28);
  box-shadow:0 0 12px rgba(110,240,255,.12);
}

/* ------------------------
   HEADER / LOGO
------------------------ */
.top{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

#logo{
  width:92px;
  height:92px;
  border-radius:50%;
  position:relative;
  display:block;
  background:
    radial-gradient(
      circle at 38% 32%,
      rgba(255,255,255,.95) 0%,
      rgba(110,240,255,.9) 8%,
      rgba(110,240,255,.5) 25%,
      rgba(138,79,255,.28) 52%,
      rgba(138,79,255,.06) 72%,
      transparent 76%
    );
  border:1px solid rgba(110,240,255,.42);
  box-shadow:
    0 0 30px rgba(110,240,255,.18),
    0 0 55px rgba(138,79,255,.1);

transition:none;
will-change:transform,filter;
  will-change:transform,box-shadow,filter;
}

#logo::before{
  content:"";
  position:absolute;
  inset:8%;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:
    inset 0 0 12px rgba(255,255,255,.12),
    0 0 12px rgba(110,240,255,.12);
  pointer-events:none;
}

#logo::after{
  content:"";
  position:absolute;
  width:28%;
  height:16%;
  top:18%;
  left:25%;
  border-radius:50%;
  background:rgba(255,255,255,.5);
  filter:blur(5px);
  transform:rotate(-25deg);
  opacity:calc(.35 + var(--music-beat)*.65);
  pointer-events:none;
}

/* ------------------------
   LOGO FLAME AURA
------------------------ */
#logo{
  --logo-beat:0;
  --logo-glow:24px;
  --logo-opacity:.42;
  overflow:visible;
  isolation:isolate;
  animation:logoPulse 1.8s ease-in-out infinite;
}

#logo::before{
  inset:-18%;
  border:none;
  border-radius:50%;
  background:
    conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(110,240,255,.05) 35deg,
      rgba(110,240,255,.8) 70deg,
      rgba(255,255,255,.9) 105deg,
      rgba(138,79,255,.7) 145deg,
      transparent 205deg,
      rgba(255,102,204,.45) 270deg,
      transparent 330deg
    );
  filter:
    blur(calc(3px + var(--logo-beat)*5px));
  opacity:
    calc(.38 + var(--logo-beat)*.62);
  animation:
    logoAuraSpin 2.4s linear infinite;
  box-shadow:
    0 0 var(--logo-glow)
    rgba(110,240,255,.55);
}

#logo::after{
  width:125%;
  height:125%;
  top:-12.5%;
  left:-12.5%;
  border-radius:50%;
  background:
    radial-gradient(
      ellipse at 50% 0%,
      rgba(255,255,255,.9),
      rgba(110,240,255,.45) 12%,
      rgba(138,79,255,.22) 34%,
      transparent 68%
    );
  filter:
    blur(calc(7px + var(--logo-beat)*7px));
  opacity:
    calc(.18 + var(--logo-beat)*.72);
  transform-origin:50% 50%;
  animation:
    logoFlame 1.15s ease-in-out infinite alternate;
}

@keyframes logoAuraSpin{
  from{
    transform:rotate(0deg) scale(1);
  }
  to{
    transform:rotate(360deg) scale(1.04);
  }
}

@keyframes logoFlame{
  0%{
    transform:scale(.94) rotate(-4deg);
  }
  50%{
    transform:scale(1.08) rotate(3deg);
  }
  100%{
    transform:scale(1.02) rotate(-2deg);
  }
}

@keyframes logoPulse{
  0%,100%{
    filter:brightness(1);
  }
  50%{
    filter:brightness(
      calc(1.08 + var(--logo-beat)*.45)
    );
  }
}

/* ------------------------
   VISUALIZER
------------------------ */
#visualizer{
  width:100%;
  height:42px;
  display:flex;
  align-items:end;
  justify-content:center;
  gap:3px;
  padding:0 4px;
}

#visualizer span{
  width:7px;
  height:8px;
  border-radius:4px;
  background:
    linear-gradient(
      180deg,
      #fff,
      var(--accent),
      var(--accent2)
    );
  box-shadow:
    0 0 8px rgba(110,240,255,.25),
    0 0 14px rgba(138,79,255,.12);

transition:none;
will-change:height,opacity,box-shadow;
}

/* ------------------------
   TRACK INFO
------------------------ */
.title{
  font-weight:700;
  font-size:1.05rem;
  text-align:center;
  line-height:1.1;
  color:#fff;
  text-shadow:
    0 0 6px var(--accent),
    0 0 12px var(--accent),
    0 0 22px var(--accent2),
    0 0 35px var(--accent2);
  transition:
    text-shadow .15s ease,
    color .15s ease;
}

.artist{
  text-align:center;
  font-size:.78rem;
  color:rgba(255,255,255,.68);
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ------------------------
   CONTROLS
------------------------ */
.controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.btn{
  padding:8px 10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.04);
  background:transparent;
  color:var(--neon);
  cursor:pointer;
  transition:
    background .15s ease,
    box-shadow .15s ease,
    transform .1s ease;
}

.btn:hover{
  background:rgba(110,240,255,.05);
  box-shadow:0 0 12px rgba(110,240,255,.1);
}

.btn:active{
  transform:scale(.94);
}

.btn.active{
  color:#fff;
  text-shadow:0 0 10px var(--accent);
}

.big{
  width:68px;
  height:68px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:
    radial-gradient(
      circle,
      rgba(110,240,255,.08),
      rgba(255,255,255,.03) 60%,
      rgba(138,79,255,.05)
    );
  border:1px solid rgba(110,240,255,.16);
  box-shadow:
    0 0 15px rgba(110,240,255,.08);
  font-size:26px;
  cursor:pointer;
  transition:
    transform .12s ease,
    box-shadow .15s ease;
}

.big:active{
  transform:scale(.94);
}

/* ------------------------
   VOLUME
------------------------ */
.row{
  display:flex;
  align-items:center;
  gap:8px;
}

.volume-container{
  display:flex;
  align-items:center;
  gap:8px;
  flex:1;
}

#volume{
  width:100%;
  accent-color:var(--accent);
}

.time{
  font-size:.82rem;
  color:rgba(255,255,255,.72);
  min-width:46px;
  text-align:center;
}

/* ------------------------
   PROGRESS BAR
------------------------ */
.row:has(#progress){
  gap:7px;
}

.progress{
  flex:1 1 auto;
  width:auto;
  height:11px;
  min-width:0;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.2),
      rgba(255,255,255,.09)
    );
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  position:relative;
  cursor:pointer;
  overflow:hidden;
  box-shadow:
    inset 0 1px 2px rgba(0,0,0,.25),
    0 0 5px rgba(110,240,255,.04);
  transition:
    box-shadow .08s linear,
    border-color .15s ease;
}

.progress:hover{
  border-color:rgba(110,240,255,.3);
  box-shadow:
    inset 0 1px 2px rgba(0,0,0,.25),
    0 0 12px rgba(110,240,255,.14);
}

.progress .bar{
  height:100%;
  width:0%;
  border-radius:999px;
  background:
    linear-gradient(
      90deg,
      #6ef0ff 0%,
      #8a4fff 55%,
      #ff66cc 100%
    );
  box-shadow:
    0 0 12px rgba(110,240,255,.25),
    0 0 20px rgba(138,79,255,.12);
  transition:
    width .1s linear,
    box-shadow .08s linear;
  position:absolute;
  top:0;
  left:0;
}

.progress .bar::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:28px;
  height:100%;
  border-radius:999px;
  background:rgba(255,255,255,.8);
  filter:blur(5px);
  opacity:calc(.2 + var(--music-beat)*.8);
  box-shadow:
    0 0 10px rgba(255,255,255,.7),
    0 0 20px rgba(110,240,255,.7);
}

/* ------------------------
   PLAYLIST
------------------------ */
.playlist-wrap{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  gap:6px;
  min-height:0;
}

.playlist{
  flex:1 1 auto;
  overflow-y:auto;
  padding-right:6px;
  border-radius:8px;
  min-height:0;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:rgba(110,240,255,.4) transparent;
}

.playlist::-webkit-scrollbar{
  width:6px;
}

.playlist::-webkit-scrollbar-thumb{
  background:rgba(110,240,255,.4);
  border-radius:3px;
}

.playlist::-webkit-scrollbar-track{
  background:transparent;
}

.item{
  padding:8px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  cursor:pointer;
  transition:
    background .12s ease,
    box-shadow .18s ease;
}

.item:hover{
  background:rgba(110,240,255,.04);
}

.item .meta{
  flex:1;
  min-width:0;
}

.item .t{
  font-weight:600;
  font-size:.95rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.item .a{
  font-size:.78rem;
  color:rgba(255,255,255,.7);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.item.active{
  background:
    linear-gradient(
      90deg,
      rgba(110,240,255,.25),
      rgba(138,79,255,.22)
    );
  box-shadow:
    0 0 12px rgba(110,240,255,.6),
    0 0 24px rgba(138,79,255,.4);
  border:1px solid rgba(110,240,255,.35);
  color:#fff;
  text-shadow:
    0 0 8px rgba(110,240,255,.8),
    0 0 16px rgba(138,79,255,.6);
  transition:all .25s ease-in-out;
}

/* ------------------------
   FAVORITE
------------------------ */
.fav{
  font-size:1.1rem;
  color:rgba(255,255,255,.45);
  user-select:none;
  padding-left:8px;
}

.fav.active{
  color:var(--accent3);
  text-shadow:0 0 8px var(--accent3);
}

/* ------------------------
   PLAYBACK RATE
------------------------ */
#rateDisplay{
  font-size:.8rem;
  color:rgba(255,255,255,.7);
  min-width:42px;
  text-align:center;
}

/* ------------------------
   HIDE PLAYLIST
------------------------ */
.playlist-wrap.hidden{
  display:none;
}

/* ------------------------
   SIDEBAR / MENU
------------------------ */
#menuToggle{
  position:fixed;
  top:16px;
  left:16px;
  font-size:28px;
  color:#00eaff;
  cursor:pointer;
  z-index:10;
  text-shadow:
    0 0 10px #00bfff,
    0 0 20px #00ffff,
    0 0 30px #00ccff;
  transition:.18s;
}

#menuToggle:hover{
  color:#fff;
  text-shadow:
    0 0 20px #00ffff,
    0 0 40px #00ccff;
}

#sidebarMenu{
  position:fixed;
  top:0;
  left:0;
  width:280px;
  height:100%;
  background:
    linear-gradient(
      90deg,
      rgba(12,45,60,.85),
      rgba(6,21,40,.95)
    );
  border-right:1px solid rgba(0,191,255,.1);
  transform:translateX(-110%);
  transition:transform .36s ease;
  z-index:55;
  display:flex;
  flex-direction:column;
  padding-bottom:20px;
  backdrop-filter:blur(12px);
}

#sidebarMenu.hidden{
  transform:translateX(-110%) !important;
}

#sidebarMenu.active{
  transform:translateX(0);
}

#sidebarMenu.show{
  left:0;
}

.sidebar-header{
  display:flex;
  align-items:left;
  padding:9px;
  font-size:21px;
  background:
    linear-gradient(
      90deg,
      rgba(12,45,60,.9),
      rgba(6,21,40,.95)
    );
  border-bottom:1px solid #9d4edd;
}

#closeMenu{
  position:absolute;
  top:8px;
  right:10px;
  cursor:pointer;
  font-size:13px;
  text-shadow:0 0 10px #e0aaff;
  background:#00bfff;
  border:none;
  color:white;
  font-weight:bold;
  padding:8px 12px;
  border-radius:8px;
  transition:.2s;
}

.sidebar-content{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.sidebar-content button{
  background:
    linear-gradient(
      90deg,
      #00bfff,
      #0077cc
    );
  color:#001;
  border:none;
  padding:10px 12px;
  border-radius:8px;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(0,191,255,.08);
}

/* ------------------------
   SHARE MODAL
------------------------ */
.share-modal{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.6);
  z-index:99999;
}

.share-content{
  background:#0b1220;
  padding:22px;
  border-radius:12px;
  box-shadow:0 12px 40px rgba(0,191,255,.06);
  color:#e6fbff;
  text-align:center;
}

.share-icons img{
  width:40px;
  height:40px;
  object-fit:contain;
  filter:invert(1);
  margin:0 10px;
  cursor:pointer;
  transition:transform .14s ease;
}

.share-icons img:hover{
  transform:scale(1.14);
}

#miniPlayer{
  z-index:99998;
}

/* ------------------------
   RESPONSIVE
------------------------ */
@media(max-width:420px){
  .player{
    width:92vw;
  }

  #logo{
    width:78px;
    height:78px;
  }

  .progress{
    height:10px;
  }

  .time{
    min-width:40px;
    font-size:.75rem;
  }
}
</style>
</head>

<body>

<div id="menuToggle" title="Menu">☰</div>

<!-- Sidebar Download -->
<div id="sidebarMenu" class="hidden">
  <div class="sidebar-header">
    <h2>WIDER NETWORK</h2>
    <span id="closeMenu">Close</span>
  </div>

  <div class="sidebar-content">
    <button id="menuRequest">📨 Request Song</button>
    <button id="menuShare">🔗 Share MusicNet</button>
    <button id="menuSearch">🔍 Search & Download</button>
    <button id="menuMyDownload">📂 My Download</button>
  </div>

  <div id="sidebarSubContent"></div>
</div>

<canvas id="bg" aria-hidden="true"></canvas>

<div class="player" aria-live="polite">

  <div class="toolbar" style="position:relative;">
    <input
      id="search"
      class="search"
      placeholder="Cari lagu atau artis..."
      aria-label="Cari lagu"
    />

    <button
      id="toggleList"
      class="icon-btn"
      title="Hide/show playlist"
    >▼</button>

    <button
      id="favOnly"
      class="icon-btn"
      title="Tampilkan favorit"
    >★</button>

    <button
      id="genreBtn"
      class="select-btn"
      aria-haspopup="true"
      aria-expanded="false"
    >Genre ▼</button>

    <div
